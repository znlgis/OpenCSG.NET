# Publishes OpenCSG.NET to NuGet.org when a version tag (v*) is pushed.
#
# Authentication: NuGet Trusted Publishing (OIDC) — no long-lived API key.
#   1. nuget.org → 账号 → 受信任的发布（Trusted Publishing）→ 新建策略，填：
#        - 存储库所有者：znlgis
#        - 存储库：OpenCSG.NET
#        - 工作流文件：nuget-publish.yml（只填文件名，不含 .github/workflows/ 路径）
#        - 环境：留空（本工作流不使用 GitHub Actions environment；
#                若将来要用环境保护，需在工作流加 environment: 并在此策略同步填写）
#   2. GitHub 仓库 → Settings → Secrets and variables → Actions → 新建 Secret：
#        NUGET_USER = nuget.org 用户名（profile name，不是邮箱地址）
#
#   流程：GitHub 颁发 OIDC 令牌 → NuGet/login 换取**临时 API 密钥（有效期 1 小时）** →
#   dotnet nuget push。因此换取密钥的步骤必须紧挨推送（本工作流已如此排列）。
#   参考：https://learn.microsoft.com/zh-cn/nuget/nuget-org/trusted-publishing
name: Publish to NuGet

on:
  push:
    tags: ['v*']

# The publish job checks out the repo (read) and exchanges its OIDC token for a
# short-lived NuGet API key (id-token: write). It never writes back to the
# repository, so repository contents stay read-only.
permissions:
  contents: read
  id-token: write # Required for OIDC trusted publishing (NuGet/login).

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Package restore/build/test honor global.json, which pins the SDK to
      # 10.0.4xx (rollForward latestFeature) - so a runner with only the 8.0
      # SDK fails upfront with "A compatible .NET SDK was not found".
      # 10.0.x = SDK for global.json, net10.0 tests and `dotnet pack`
      # (pack/publish on its own needs nothing else). 8.0.x is installed solely
      # because the test pre-gate below runs the dual-TFM Tests project
      # (net8.0;net10.0): the net8.0 leg needs an 8.x runtime, and
      # actions/setup-dotnet provides runtimes only by installing an SDK.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      # Build and test. The test project transitively compiles the core
      # library via ProjectReference. Tests must pass before publishing.
      - name: Test
        run: dotnet test tests/OpenCSG.NET.Tests/OpenCSG.NET.Tests.csproj -c Release

      # Extract the version from the git tag (strip "v" prefix).
      # e.g., tag "v1.2.3" → VERSION="1.2.3"
      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      # Pack the core library for NuGet publication.
      # -p:Version overrides the placeholder in the csproj.
      - name: Pack
        run: dotnet pack src/OpenCSG.NET/OpenCSG.NET.csproj -c Release -o out -p:Version=${{ env.VERSION }}

      # Exchange the GitHub OIDC token for a temporary NuGet API key
      # (valid for 1 hour; one OIDC token can be exchanged once).
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Publish the .nupkg to NuGet.org with the short-lived key.
      # --skip-duplicate allows re-running the workflow for the same tag without error.
      - name: Push to NuGet
        run: dotnet nuget push out/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
