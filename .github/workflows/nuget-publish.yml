# Publishes OpenCSG.NET to NuGet.org when a version tag (v*) is pushed.
# Requires NUGET_API_KEY secret configured in the repository settings.
name: Publish to NuGet

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Build and test. The test project transitively compiles the core
      # library via ProjectReference. Tests must pass before publishing.
      - name: Test
        run: dotnet test tests/OpenCSG.NET.Tests/OpenCSG.NET.Tests.csproj -c Release

      # Pack the core library for NuGet publication.
      - name: Pack
        run: dotnet pack src/OpenCSG.NET/OpenCSG.NET.csproj -c Release -o out

      # Publish the .nupkg to NuGet.org. --skip-duplicate allows re-running
      # the workflow for the same tag without error.
      - name: Push to NuGet
        run: dotnet nuget push out/*.nupkg -k ${{ secrets.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate
